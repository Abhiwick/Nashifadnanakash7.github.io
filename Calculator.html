body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #1a1410;
  font-family: 'Georgia', serif;
}

.calculator {
  width: 320px;
  background: #221e18;
  border: 1px solid #3a3028;
  box-shadow: 0 24px 60px rgba(0,0,0,0.6);
}

.display {
  padding: 24px 20px 16px;
  text-align: right;
  background: #1a1410;
  border-bottom: 1px solid #2e2620;
}

.expression {
  font-size: 13px;
  color: #7a6f63;
  min-height: 18px;
  margin-bottom: 6px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.result {
  font-size: 48px;
  font-weight: bold;
  color: #f5f0e8;
  line-height: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.buttons {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: #2e2620;
}

button {
  background: #221e18;
  border: none;
  color: #f5f0e8;
  font-size: 20px;
  padding: 22px 10px;
  cursor: pointer;
  transition: background 0.1s;
}

button:hover { background: #2e2822; }
button:active { background: #c8973a; color: #1a1410; }

button.op { color: #c8973a; }
button.op:active { background: #c8973a; color: #1a1410; }

button.equals {
  background: #c8973a;
  color: #1a1410;
  font-size: 24px;
}
button.equals:hover { background: #d9a840; }
button.equals:active { background: #e0b050; }

button.clear { color: #e07070; font-size: 16px; }
button.clear:active { background: #c8973a; color: #1a1410; }

button.span2 { grid-column: span 2; }

<body>

<div class="calculator">
  <div class="display">
    <div class="expression" id="expression"></div>
    <div class="result" id="result">0</div>
  </div>
  <div class="buttons">
    <button class="clear" onclick="clearAll()">AC</button>
    <button class="op" onclick="toggleSign()">+/−</button>
    <button class="op" onclick="percent()">%</button>
    <button class="op" onclick="inputOp('/')">÷</button>

<button onclick="inputNum('6')">6</button>
<button class="op" onclick="inputOp('-')">−</button>

<button onclick="inputNum('3')">3</button>

  </div>

<script>
  let current = '0', previous = '', operator = null, shouldReset = false;
  const resultEl = document.getElementById('result');
  const exprEl = document.getElementById('expression');

  function updateDisplay() { resultEl.textContent = current; }

  function inputNum(n) {
    if (shouldReset) { current = n; shouldReset = false; }
    else current = current === '0' ? n : current + n;
    updateDisplay();
  }

  function inputDot() {
    if (shouldReset) { current = '0.'; shouldReset = false; updateDisplay(); return; }
    if (!current.includes('.')) current += '.';
    updateDisplay();
  }

  function inputOp(op) {
    if (operator && !shouldReset) calculate(true);
    previous = current; operator = op; shouldReset = true;
    const s = { '/': '÷', '*': '×', '-': '−', '+': '+' };
    exprEl.textContent = previous + ' ' + s[op];
  }

  function calculate(chain = false) {
    if (!operator || !previous) return;
    const a = parseFloat(previous), b = parseFloat(current);
    let res;
    if (operator === '/') res = b !== 0 ? a / b : 'Error';
    else if (operator === '*') res = a * b;
    else if (operator === '-') res = a - b;
    else if (operator === '+') res = a + b;
    if (!chain) {
      const s = { '/': '÷', '*': '×', '-': '−', '+': '+' };
      exprEl.textContent = previous + ' ' + s[operator] + ' ' + current + ' =';
      operator = null;
    }
    current = res === 'Error' ? 'Error' : String(parseFloat(res.toFixed(10)));
    shouldReset = true;
    updateDisplay();
  }

  function clearAll() {
    current = '0'; previous = ''; operator = null; shouldReset = false;
    exprEl.textContent = ''; updateDisplay();
  }

  function toggleSign() { current = String(parseFloat(current) * -1); updateDisplay(); }
  function percent() { current = String(parseFloat(current) / 100); updateDisplay(); }
</script>
